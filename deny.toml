[graph]
all-features = true

[advisories]
# "deny" would fail on chacha20 0.10.1 and libssh2-sys 0.3.2, both pre-existing
# transitive yanked versions (via rand/pdf-extract/sqlx and git2 respectively) with
# no per-crate exception in this schema version; "warn" keeps the signal visible
# without failing the gate on debt this lot does not touch.
yanked = "warn"
unmaintained = "workspace"
# Pre-existing, unfixable-in-tree advisories. h2 0.3/rustls-webpki 0.101.7 (the
# legacy hyper-0.14 stack aws-sdk-s3's default `rustls` feature pulled in
# alongside its real, modern `default-https-client` connector) were eliminated
# by disabling that unused legacy feature rather than ignored (Cargo.toml); only
# rsa's Marvin timing side-channel remains, with no fixed release upstream as of
# this lot. Revisit at the next dependency upgrade pass.
ignore = [
    "RUSTSEC-2023-0071", # rsa (Marvin timing side-channel; used for JWT signing keys, no fix released)
    "RUSTSEC-2026-0183", # git2 unsound Remote::list() (no fix released yet)
    "RUSTSEC-2026-0184", # git2 unsound BlameHunk signature (no fix released yet)
]

[licenses]
# "bzip2-1.0.6" (SPDX id, zlib/libpng-style permissive text) added for
# `libbz2-rs-sys`, a transitive dependency of the `bzip2` crate pinned in
# SPEC-0015 US-0006 for `.tar.bz2` decode.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CDLA-Permissive-2.0", "Unlicense", "0BSD", "CC0-1.0", "BSL-1.0", "OpenSSL", "bzip2-1.0.6"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies (crates/mcp-fs -> crates/core) carry no version
# constraint by design; they are resolved from the local tree, never crates.io.
allow-wildcard-paths = true
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
