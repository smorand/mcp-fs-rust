# PostgreSQL for the opt-in relational integration tests.
#
#   docker compose -f docker-compose.test.yml up -d
#   MCPFS_TEST_PG_DSN=postgres://mcpfs:mcpfs@127.0.0.1:55432/mcpfs \
#     cargo test --workspace --all-features
#   docker compose -f docker-compose.test.yml down -v
#
# Without that variable the tests skip themselves, so `cargo test --workspace`
# stays green with no Docker installed. Ports are unusual on purpose, so this never
# collides with a real PostgreSQL on 5432.
services:
  postgres:
    # pgvector, not vanilla postgres: `--all-features` compiles the `rag` feature,
    # whose Postgres pool runs `CREATE EXTENSION IF NOT EXISTS vector` on every
    # new connection (crates/mcp-fs/src/storage/rel/postgres.rs). Against a plain
    # postgres:16 image that extension is never available, so every connection
    # attempt fails after_connect and the pool can never hand one out; every
    # caller then times out waiting for a pooled connection with no server-side
    # trace of the attempt. pgvector/pgvector:pg16 is a drop-in Postgres 16 image
    # that also ships the extension, so the same after_connect hook succeeds.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mcpfs
      POSTGRES_PASSWORD: mcpfs
      POSTGRES_DB: mcpfs
    ports:
      - "55432:5432"
    # The tests connect immediately, so readiness has to be observable.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcpfs -d mcpfs"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      # Throwaway data: no volume to clean up, and a faster test run.
      - /var/lib/postgresql/data
