# Advisories accepted on purpose (SPEC-0035). Each line names the crate and why
# it stays; remove an id when its backlog entry lands. Yanked warnings are never
# ignored here, so a new yank still shows.
[advisories]
ignore = [
    "RUSTSEC-2023-0071", # rsa Marvin timing side channel, JWT signing keys, no fix released
    "RUSTSEC-2024-0384", # instant unmaintained, via datafusion 43
    "RUSTSEC-2024-0436", # paste unmaintained, via datafusion 43
    "RUSTSEC-2026-0192", # ttf-parser unmaintained, via pdf-extract 0.12.1, no newer release
    "RUSTSEC-2026-0253", # lru unsound pop, via tantivy 0.26.2 (no fix) and aws-sdk-s3 (until BL-0060)
    "RUSTSEC-2026-0002", # lru unsound IterMut, via aws-sdk-s3 (until BL-0060)
    "RUSTSEC-2026-0367", # zip 3.0.0, build dependency of utoipa-swagger-ui, unpacks only its vendored archive (until BL-0059)
    "RUSTSEC-2026-0368", # zip 3.0.0, build dependency of utoipa-swagger-ui, unpacks only its vendored archive (until BL-0059)
    "RUSTSEC-2026-0369", # zip 3.0.0, build dependency of utoipa-swagger-ui, unpacks only its vendored archive (until BL-0059)
]
