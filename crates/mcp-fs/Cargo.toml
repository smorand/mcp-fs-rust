[package]
name = "mcp-fs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Streamable-HTTP MCP server exposing a simulated multi-project filesystem (Rust port)"

[[bin]]
name = "mcp-fs"
path = "src/main.rs"

[lib]
name = "mcp_fs"
path = "src/lib.rs"

[features]
default = []
# A relational backend other than SQLite is opt in, so the default build keeps
# the zero external service posture and gains no dependency surface.
postgres = ["dep:sqlx"]
# SQL Server through tiberius-ng plus a bb8 pool. Off by default: the fork is
# young and a default build must carry neither it nor its TLS stack.
sqlserver = ["dep:tiberius-ng", "dep:bb8", "dep:tokio-util"]
# Every relational backend at once, for CI and for the quality gate.
all-backends = ["postgres", "sqlserver"]

[dependencies]
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
schemars = { workspace = true }

rusqlite = { workspace = true }
sqlx = { workspace = true, optional = true }
tiberius-ng = { workspace = true, optional = true }
bb8 = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
aws-sdk-s3 = { workspace = true }
aws-config = { workspace = true }
aws-credential-types = { workspace = true }
sha2 = { workspace = true }
md-5 = { workspace = true }
sha1 = { workspace = true }
hex = { workspace = true }

jsonwebtoken = { workspace = true }
rsa = { workspace = true }
rand = { workspace = true }

git2 = { workspace = true }

regex = { workspace = true }
globset = { workspace = true }
similar = { workspace = true }
zip = { workspace = true }

aes-gcm = { workspace = true }
base64 = { workspace = true }

reqwest = { workspace = true }

utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }

clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
