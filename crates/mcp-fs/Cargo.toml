[package]
name = "mcp-fs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Streamable-HTTP MCP server exposing a simulated multi-project filesystem (Rust port)"
publish = false

[[bin]]
name = "mcp-fs"
path = "src/main.rs"

[features]
default = []
postgres = ["mcp-fs-core/postgres"]
sqlserver = ["mcp-fs-core/sqlserver"]
rag = ["mcp-fs-core/rag"]
all-backends = ["mcp-fs-core/all-backends"]

[dependencies]
tokio = { workspace = true }
mcp-fs-core = { path = "../core" }
