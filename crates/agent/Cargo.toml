[package]
name = "agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "agent"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync", "signal"] }
reqwest = { workspace = true, features = ["json", "rustls-tls", "stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
crossterm = { workspace = true }
unicode-width = { workspace = true }
futures = { workspace = true }
libc = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# DT-002 (SPEC-0013/US-0008): the real migrated server, booted in-process on an
# ephemeral port, to prove this crate's McpClient actually completes the
# initialize handshake against it. Test-only: not in [dependencies].
mcp-fs-core = { path = "../core" }
axum = { workspace = true }
