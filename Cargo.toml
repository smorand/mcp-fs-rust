[workspace]
resolver = "3"
members = ["crates/mcp-fs", "crates/core", "crates/agent"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
license = "MIT"
repository = "https://github.com/smorand/mcp-fs-rust"

[workspace.dependencies]
# ── async / http ───────────────────────────────────────────────────────────────
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "signal", "sync", "time"] }
axum = { version = "0.8", features = ["multipart", "json", "ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
hyper = "1"
http = "1"
bytes = "1"

# ── serialization / config ─────────────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_norway = "0.9"
schemars = "1"
# XDG base directories (config resolution, DR-005). Version resolved via
# crates.io at implementation time, pinned to the minor series like every
# other dependency here (DDRIFT-001). No `figment` dependency: see DDRIFT-002.
etcetera = "0.11"

# ── storage ────────────────────────────────────────────────────────────────────
rusqlite = { version = "0.37", features = ["bundled"] }
# PostgreSQL, optional and off by default: a default build carries neither the
# dependency nor its TLS stack. `macros` is deliberately absent because every
# statement here is built at runtime, so the compile time query checker and its
# offline metadata would be weight with no user.
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-config = "1"
aws-credential-types = "1"
# Promoted from transitive (already in Cargo.lock): the S3 client picks its trust store (SPEC-0059).
aws-smithy-http-client = { version = "1.5", default-features = false, features = ["rustls-aws-lc"] }
rustls-native-certs = "0.8"
rustls = { version = "0.23", default-features = false }
sha2 = "0.10"
md-5 = "0.10"
sha1 = "0.10"
hex = "0.4"

# ── identity ───────────────────────────────────────────────────────────────────
jsonwebtoken = "9"
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"

# ── mcp ────────────────────────────────────────────────────────────────────────
rmcp = { version = "3.5.0", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }

# ── git ────────────────────────────────────────────────────────────────────────
# git2 0.21 changed its default features from ["ssh", "https"] to []. Without them
# libgit2 has no HTTPS and no SSH transport and every remote clone, push, fetch and
# pull fails at runtime, so the 0.20 defaults are listed explicitly (SPEC-0035/DR-008).
git2 = { version = "0.21", features = ["https", "ssh"] }
# Host key validation and, later, remote URL parsing (git::remote). Was already
# a transitive dependency of several other crates; promoted to direct because
# the crate reads it by name (DRIFT-003).
url = "2.5"

# ── documents / search ─────────────────────────────────────────────────────────
regex = "1"
globset = "0.4"
similar = "2"
zip = { version = "9", default-features = false, features = ["deflate", "aes-crypto"] }
# Pure-Rust tar reader (SPEC-0015 US-0006): `.tar`/`.tar.gz`/`.tar.bz2`/`.tar.xz` entries.
tar = "0.4"
# `.tar.gz`/`.tgz` decompression. Default features pull the pure-Rust `miniz_oxide`
# backend, so no system zlib dependency.
flate2 = "1"
# `.tar.bz2`/`.tb2` decompression. Default features (0.6+) use `libbz2-rs-sys`,
# a pure-Rust port, so no system libbz2 dependency.
bzip2 = "0.6"
# `.tar.xz`/`.txz` decompression, pure Rust.
lzma-rs = "0.3"
# `.7z` decompression. `sevenz-rust2`, not `sevenz-rust` (DEC-007: the latter has
# an unmaintained advisory and its repository was deleted). Pinned under 0.21 to
# stay within this workspace's MSRV (0.21+ requires a newer rustc than 1.94.1).
sevenz-rust2 = { version = "0.20", features = ["util", "aes256"] }
tantivy = "0.27"
# sqlite-vec is pre-v1: pinned exactly so an upstream breaking change cannot sneak in.
sqlite-vec = "=0.1.9"
zerocopy = { version = "0.7", features = ["derive"] }

# ── crypto (oauth token at rest) ───────────────────────────────────────────────
aes-gcm = "0.10"
base64 = "0.22"

# ── http client (device flow, ocr) ─────────────────────────────────────────────
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }

# ── openapi ────────────────────────────────────────────────────────────────────
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# ── terminal ui (agent) ────────────────────────────────────────────────────────
crossterm = "0.29"
unicode-width = "0.2"
libc = "0.2"

# ── cli / logging / misc ───────────────────────────────────────────────────────
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
thiserror = "2"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
futures = "0.3"
tempfile = "3"
which = "6"

# ── analytics ─────────────────────────────────────────────────────────────────
# Pinned to an apache/datafusion main revision because no released datafusion
# depends on arrow 60, the first arrow whose zstd is 0.14 (the 0.13 family carries
# RUSTSEC-2026-0391 and its siblings). Move back to crates.io with BL-0089.
datafusion = { git = "https://github.com/apache/datafusion", rev = "6f1436fe1407495019d8afec8a9f55663f418d9a", features = ["parquet"] }
arrow = "60"
parquet = { version = "60", features = ["arrow"] }

# ── document extraction / code symbols (docs module) ───────────────────────────
pdf-extract = "0.12"
quick-xml = "0.41"
tree-sitter = "0.26"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-ruby = "0.23"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
